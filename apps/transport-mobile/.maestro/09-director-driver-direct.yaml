# #398 — GIAM DOC thay DUNG hai ket cuc cua 07/08:
#
#   · don tu tao cua 07 la TIN TUC trong "Hom nay" (muc "Don moi tu tai xe"), khong phai viec can
#     quyet — va KHONG co nut duyet nao;
#   · viec thieu diem giao cua 08 nam trong "Can xu ly".
#
# "Don binh thuong khong lam tang hang viec" duoc kiem bang so qua API o
# tools/mobile-smoke/verify-driver-direct.mjs (Maestro khong dem duoc).
appId: com.nexagnet247.transport.preview
tags:
  - director
  - intake
  - smoke
---
- runFlow:
    file: subflows/launch-and-login.yaml
    env:
      LOGIN_USERNAME: ${MAESTRO_DIRECTOR_USERNAME}
- extendedWaitUntil:
    visible: 'Hôm nay'
    timeout: 45000
# Cuon toi CHINH the don (khong chi tieu de muc): muc nam duoi phan "Can quyet truoc", va dung o
# tieu de thi the don con o duoi mep man hinh (run 36214207789).
- scrollUntilVisible:
    element:
      id: 'director-driver-order-.*'
    direction: DOWN
    timeout: 45000
    centerElement: true
- assertVisible:
    id: director-driver-orders
- assertVisible: '.*${MAESTRO_INTAKE_DRIVER_NAME}.*'
- assertNotVisible: 'Duyệt đơn'
- takeScreenshot: 09-hom-nay-don-moi-tu-tai-xe
- tapOn: 'Cần xử lý'
# Viec thieu diem giao nam GAN CUOI hang (~50 muc cua demo): may chu xep theo MUC roi theo TEN LOAI,
# `SITE_INTAKE_…` dung sau `FUEL_…`/`MAINTENANCE_…`. 30s cuon tren man 320x640 chi toi muc ~33
# (run 36216258929) — cuon toi CHINH the viec, du thoi gian, va dua the vao giua man.
- scrollUntilVisible:
    element:
      id: 'director-queue-item-SITE_INTAKE_NEEDS_REVIEW'
    direction: DOWN
    timeout: 150000
    centerElement: true
- assertVisible: 'Việc tài xế nhận trực tiếp chưa đủ thông tin'
- assertVisible:
    id: director-queue-note-SITE_INTAKE_NEEDS_REVIEW
    text: '.*điểm giao.*'
- takeScreenshot: 09-can-xu-ly-thieu-diem-giao
