packages:
  - apps/*
  - packages/*
  - tools/*

onlyBuiltDependencies:
  - '@swc/core'
  - argon2
  - esbuild
  - sharp

overrides:
  ip-address: '>=10.3.1'
  '@tiptap/core': 2.27.2
  '@tiptap/extension-link': 2.27.2
  '@tiptap/pm': 2.27.2
  '@hono/node-server': 2.0.12
  '@remix-run/router': 1.23.2
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.4
  # GHSA-5jgf-p345-68v8 · GHSA-f65p-4m7j-42xc · GHSA-fph4-wmhf-6fwf · GHSA-jqff-g426-hqxp —
  # bon advisory HIGH cua fast-uri, ca bon vao repo qua DUY NHAT mot duong bac cau:
  # apps/api -> @modelcontextprotocol/sdk -> ajv@8 -> fast-uri. Khong goi nao trong workspace
  # khai fast-uri truc tiep, nen override la cho DUY NHAT dat duoc san.
  #
  # Ghim CHINH XAC `3.1.5` chinh la cai da lam cong `audit` do: ban vao dung dai dinh loi cua ca
  # bon advisory, va vi la ghim cung nen mot `pnpm install` binh thuong khong the tu bo len ban
  # da va. Doi sang SAN, dung nhu cach `sharp` va `browserslist` ben duoi da lam.
  #
  # `<4` khong thua: ajv@8.20.0 khai `fast-uri: ^3.0.1`, nen mot `>=3.1.6` tran se keo major moi vao
  # ngay khi fast-uri 4.0.0 len npm — va lam vo duong kiem JSON Schema cua MCP tool mot cach im
  # lang, dung kieu ma cong `audit` khong bat duoc.
  fast-uri: '>=3.1.6 <4'
  postcss: 8.5.18
  i18next-http-backend: 3.0.5
  react-router-dom: 6.30.1
  # Ghim SAN (>=) chu khong ghim CHINH XAC. Muc dich ban dau chi la chan ban cu, nhung
  # `sharp: 0.35.0` ghim cung lai keo NGUOC apps/api (khai ^0.35.3) ve 0.35.0. Ban 0.35.0
  # thieu dieu kien `types` cho nhanh ESM trong exports map -> typecheck do TS7016.
  # Lockfile cu con giu ca hai ban nen chua lo; cai lai la override thang.
  sharp: '>=0.35.3'
  tinymce: 7.9.3
  uuid: 11.1.1
  js-yaml: 4.3.1
  nanoid: 3.3.18
  deepmerge-ts: '>=8.0.0'
  # GHSA-c83g-rgw3-j3cx (OOM do cache khong bi thu hoi) + GHSA-73wf-gq98-2v4g (ghi prototype qua
  # browserslist-stats.json) — ca hai HIGH, va ca hai vao repo qua DUY NHAT mot duong bac cau:
  # apps/api -> adminjs -> @babel/preset-env -> @babel/helper-compilation-targets -> browserslist.
  # Khong goi nao trong workspace khai browserslist truc tiep, nen khong the sua bang cach nang
  # mot dependency cap mot; override la cho DUY NHAT dat duoc san.
  #
  # `<5` khong thua. Override CUONG CHE version bat ke consumer khai gi, ma ca ba consumer deu
  # khai theo ho ^4 (`^4.24.0` cua helper-compilation-targets, `^4.28.1` cua core-js-compat,
  # `>= 4.21.0` cua update-browserslist-db). Neu chi viet `>=4.28.7` thi ngay khi browserslist
  # 5.0.0 len npm, mot lan re-resolve se keo major moi vao va lam vo Babel — dung kieu do im lang.
  browserslist: '>=4.28.7 <5'
