# STACK CUA MOT KHACH. Moi khach chay mot ban rieng cua file nay: rieng project, rieng volume,
# rieng PostgreSQL, rieng Flowise — dung mo hinh silo trong docs/kien-truc/nen-tang-da-khach.md
# ("khong dung shared DB/tenantId trong phase silo").
#
# Ten project quyet dinh ten volume, nen no phai mang STACK SLUG chu khong phai tenant slug.
# STACK SLUG = tenant + moi truong (xem stack-identity.mjs): `ultty` cho dev/production — dung
# chuoi cu, stack dang chay giu nguyen volume va du lieu PostgreSQL cua no — va `ultty-gd1-test`
# cho moi truong ky thuat GD1-test, tuc mot stack RIENG chu khong phai ghi de len stack dev.
# render-secrets.sh luon ghi STACK_SLUG vao secrets.env; mac dinh cua no la TENANT_SLUG.
#
# KHONG con service `gateway` o day: :80/:443 nay thuoc tang edge dung chung (deploy/netviet/edge/).
name: zalo-${STACK_SLUG:-${TENANT_SLUG}}

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    # `always` (khong phai `unless-stopped`): stack phai tu quay lai ke ca sau khi ai do
    # `docker stop` thu cong roi VM reboot — yeu cau "he thong tren VM luon chay".
    restart: always
    environment:
      POSTGRES_USER: netviet_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      ZALO_DB_PASSWORD: ${ZALO_DB_PASSWORD}
      FLOWISE_DB_PASSWORD: ${FLOWISE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netviet_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data

  bootstrap:
    image: ${APP_IMAGE}
    profiles: ["tools"]
    user: "0:0"
    # Khong `depends_on` o day: `compose.flowise.yaml` gan lai `flowise: service_healthy` khi ho so
    # bat Flowise. Cac loi goi khac cua service nay (migrate, bootstrap auth, seed, smoke) deu chay
    # voi `--no-deps` nen chung chua bao gio phu thuoc vao Flowise.
    env_file:
      - ./.runtime/flowise.env
    environment:
      FLOWISE_BASE_URL: http://flowise:3000
      FLOWISE_ADMIN_EMAIL: ${FLOWISE_ADMIN_EMAIL}
      FLOWISE_ADMIN_PASSWORD: ${FLOWISE_ADMIN_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      FLOWISE_RUNTIME_ENV_PATH: /runtime/flowise.env
      DATABASE_URL: postgresql://zalo:${ZALO_DB_PASSWORD}@postgres:5432/zalo
      PILOT_AUTH_MODE: ${AUTH_MODE:-session}
      PILOT_OPERATOR_USERNAME: ${PILOT_OPERATOR_USERNAME}
      PILOT_OPERATOR_NAME: ${PILOT_OPERATOR_NAME}
      PILOT_OPERATOR_PASSWORD: ${PILOT_OPERATOR_PASSWORD}
    command: ["node", "deploy/flowise/bootstrap-flowise.mjs"]
    volumes:
      - ./.runtime:/runtime
      # smoke-test.mjs chay trong chinh container nay va doc tin nhan mau tu goi khach: cau don
      # hop le phu thuoc SKU/dai ly/glossary rieng tung khach nen khong the nam trong script.
      - ./tenant-pack:/srv/tenant:ro
    networks:
      - backend
      - data
    extra_hosts:
      - "${OPERATOR_DOMAIN}:host-gateway"

  api:
    image: ${APP_IMAGE}
    # `always` (khong phai `unless-stopped`): stack phai tu quay lai ke ca sau khi ai do
    # `docker stop` thu cong roi VM reboot — yeu cau "he thong tren VM luon chay".
    restart: always
    # `depends_on` KHONG con nhac Flowise o day, va do la mot HOP DONG chu khong phai don dep.
    #
    # Flowise nam trong `compose.flowise.yaml` — mot lop phu chi duoc keo vao khi ho so trien khai
    # that su bat no. Mot ho so `flowise=false` (vd ban xem truoc Transport) khong con phai dung
    # len mot container Flowise ma no khong dung, va do cung la thu duy nhat khien 8 bi mat Flowise
    # tro thanh bat buoc cho MOI stack.
    #
    # Voi ho so CO Flowise, lop phu dat lai DUNG dong `flowise: service_healthy` nay, nen thu tu
    # khoi dong cua Ultty khong doi mot ky tu.
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.runtime/flowise.env
    environment:
      NODE_ENV: production
      PORT: 3001
      # GOI KHACH mount tu NGOAI image. Image la ban chung cho moi khach va khong mang goi nao
      # (.dockerignore loai `tenants/`), nen du lieu thuong mai cua tung khach — gia si, dieu khoan
      # cong no, chat ID nhom Zalo — chi co mat tren dung stack cua ho.
      # Dung TENANT_DIR chu khong phai TENANT: trong image khong co thu muc `tenants/` de tra slug.
      TENANT_DIR: /srv/tenant
      # Anh CATALOG san pham — cung ly do mount ngoai image nhu goi khach: anh cua tung khach,
      # khong phai cua ban chung. TACH khoi MEDIA_* (anh khach gui vao, co PII, bucket private).
      CATALOG_DIR: /srv/catalog
      # Zalo TU di tai anh ve tu URL nay, nen phai la ten mien cong khai that. Goi khach luu
      # locator TUONG DOI de mot goi chay duoc ca local/demo/pilot; API ghep goc nay luc gui.
      PUBLIC_BASE_URL: https://${OPERATOR_DOMAIN}
      DATABASE_URL: postgresql://zalo:${ZALO_DB_PASSWORD}@postgres:5432/zalo
      PERSISTENCE: prisma
      PARSER_MODE: ${PARSER_MODE:-flowise}
      FLOWISE_BASE_URL: http://flowise:3000
      FLOWISE_TIMEOUT_MS: ${FLOWISE_TIMEOUT_MS:-60000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      # AGENT TU VAN (Pha 6). Block `environment` nay liet ke TUONG MINH, nen mot bien co trong
      # `secrets.env` ma khong co o day thi KHONG BAO GIO toi container — dung cai bay da lam
      # `ADVICE_COMPOSER` rong tren stack suot tu 19/08 den 21/08 du render-secrets.sh da phat no.
      ADVICE_COMPOSER: ${ADVICE_COMPOSER:-off}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADVICE_MODEL: ${ADVICE_MODEL:-claude-opus-5}
      ADVICE_DEEPSEEK_MODEL: ${ADVICE_DEEPSEEK_MODEL:-deepseek-v4-flash}
      CHANNEL_MODE: ${CHANNEL_MODE:-zca}
      ZALO_BOT_TOKEN: ${ZALO_BOT_TOKEN:-}
      ZALO_CRED_PATH: /runtime/zalo/zalo-cred.json
      ZALO_ALLOWED_GROUPS_PATH: /runtime/zalo/zalo-allowed-groups.json
      ZALO_OPERATOR_ORIGIN: https://${OPERATOR_DOMAIN}
      ZALO_SELF_LISTEN: "off"
      AUTO_ACK: "off"
      AUTO_SEND: ${AUTO_SEND:-on}
      API_KEY: ${API_KEY}
      # Pilot public dung session server-side; `none` chi danh cho local/CI khong public.
      # API_KEY van render san cho automation tuong lai, khong dua vao browser.
      AUTH_MODE: ${AUTH_MODE:-session}
      DATA_CLASSIFICATION: ${DATA_CLASSIFICATION:-test}
      SESSION_SECRET: ${SESSION_SECRET}
      # Kho anh. MAC DINH `none` = khong luu anh nao: link anh Zalo chet trong <=35 ngay nen day
      # la mat vinh vien, PHAI la mot lua chon co y chu khong phai hieu ung phu cua lan deploy.
      # render-secrets.sh dat `gcs` khi biet bucket; khong biet -> `none`.
      #
      # KHONG CO KHOA NAO O DAY: container ke thua tai khoan dich vu gan san cua VM (ADC), nen
      # khong co bi mat dai han de phat/xoay vong/lo. Thu hoi = go IAM binding.
      # Bucket phai la bucket dang mang rule lifecycle prefix `media/` (giu 60/365 ngay) —
      # tro nham bucket thi rule khong co tac dung ma cung khong bao loi.
      MEDIA_STORE: ${MEDIA_STORE:-none}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-}
      MEDIA_GCS_ENDPOINT: ${MEDIA_GCS_ENDPOINT:-https://storage.googleapis.com}
      # Cong chan SSRF: chi tai anh tu host cua Zalo. Khop theo bien dau cham nen `evil-zdn.vn`
      # bi chan; de rong = chan het.
      MEDIA_ALLOWED_HOSTS: ${MEDIA_ALLOWED_HOSTS:-zdn.vn}
      CORS_ORIGIN: https://${DEMO_DOMAIN}
      ADMIN_UI: "off"
      STREAM_MODE: "on"
      # QUAN SAT (21/08/2026) — xem docs/phat-trien/van-hanh/debugging.md.
      # Nhac lai cai bay o tren: khoi `environment` nay liet ke TUONG MINH, nen mot bien co trong
      # `secrets.env` ma thieu o day thi KHONG BAO GIO toi container.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      TELEMETRY_PRIVACY: ${TELEMETRY_PRIVACY:-}
      # `dev` | `gd1-test` | `pilot` | `production`. render-secrets.sh phat bien nay tu lau nhung
      # KHONG AI dua no vao day, nen no chua bao gio toi container — dung cai bay ma chinh khoi
      # chu thich o dau service canh bao. Trace can no de tach du lieu theo moi truong; thieu no
      # thi moi ban ghi deu roi ve `production` cua NODE_ENV va gd1-test lan voi pilot.
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-}
      # Neo moi trace vao dung ban build dang chay. Khong co ba bien nay thi cau hoi
      # "bug nay o commit nao" phai tra loi bang cach SSH len VM doc release.json roi doi chieu tay.
      RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-}
      RELEASE_APP_DIGEST: ${RELEASE_APP_DIGEST:-}
      RELEASE_DEPLOYED_AT: ${RELEASE_DEPLOYED_AT:-}
      # NGUON CANONICAL cua danh tinh ban phat hanh. Ba bien tren van la duong DU PHONG — chung
      # song sot cho duong goi tay tren VM va cho stack chua kip mount — nhung tep nay moi la thu
      # `resolveReleaseIdentity()` doc truoc, va tien trinh noi ro minh dang doc nguon nao.
      #
      # GIA TRI GHI CUNG, khong phai bien: day la duong dan BEN TRONG container, khong phai tren
      # host. Mot host path cu the (`/srv/netviet/apps/<stack>/…`) cam vao day se khong len duoc
      # khach thu hai, con mot bien thi co the bi quen o `render-secrets.sh` — dung cai bay da lam
      # `ADVICE_COMPOSER` rong suot 19/08 -> 21/08.
      RELEASE_MANIFEST_PATH: /runtime/release.json
      # WORKFLOW ENGINE — phia NEXAGNET (xep hang + dispatcher). Tien trinh worker la mot service
      # RIENG o cuoi file; day chi la ben GUI VIEC DI.
      #
      # `WORKFLOW_ENGINE` MAC DINH `off`, va do la ca diem cua quyet dinh Q1-A: `deploy-remote.sh`
      # rsync CUNG MOT `tenant-pack` cho `zalo-ultty` (production) lan `zalo-ultty-gd1-test`, nen
      # goi khach mot minh no khong tach duoc hai moi truong. Cong tac lam viec do. Mot cong tac
      # mac dinh `on` khong bao ve duoc gi.
      #
      # KHONG co `depends_on` toi `hatchet-engine` o day, va do la CO Y: `api` khong mang profile
      # nao, nen mot `depends_on` toi service co profile se KEO CA CUM HATCHET LEN moi lan deploy
      # — dung cai ma `profiles: ["workflow"]` sinh ra de tranh. `api` boot duoc ma khong can
      # engine vi cong Hatchet khoi tao TRE (W9 do dieu do tren do thi Nest that).
      WORKFLOW_ENGINE: ${WORKFLOW_ENGINE:-off}
      WORKFLOW_ENGINE_TOKEN: ${WORKFLOW_ENGINE_TOKEN:-}
      # GHI CUNG, khong phai bien — xem ly do day du o service `workflow-worker-v1`.
      WORKFLOW_ENGINE_HOST_PORT: hatchet-engine:7070
      WORKFLOW_ENGINE_TLS_STRATEGY: none
      # DUONG CHO MAY (REST) — NOI BO, khong di qua Caddy. Bien nay va `..._DASHBOARD_URL` ngay
      # duoi tro HAI CHO KHAC NHAU, va gop chung lam mot chinh la loi da xay ra 25/08/2026:
      # thieu bien nay, SDK lay goc REST tu claim `server_url` trong token = ten mien cong khai,
      # von nam sau basic-auth => moi lan `describeRun` deu an 401 trong khi gRPC van chay tot.
      # Trieu chung o phia nguoi dung: man hinh chan doan thieu hang "Trang thai o engine".
      WORKFLOW_ENGINE_API_URL: http://hatchet-dashboard
      WORKFLOW_ENGINE_DASHBOARD_URL: https://${WORKFLOW_DOMAIN}
      WORKFLOW_ENGINE_NAMESPACE: ${WORKFLOW_ENGINE_NAMESPACE:-}
      # QUAN SAT BEN (OTel -> Collector -> ClickHouse). Cong tac DUY NHAT la `OTEL_TRACING`, va
      # mac dinh cua no la `off` o `otel-config.ts` — tat = khong SDK nao duoc nap, khong mot byte
      # nao roi khoi tien trinh. Xem `docs/kien-truc/reference-platform-stack.md` §8.
      #
      # `OTEL_SERVICE_NAME` DAT RIENG cho tung service o day chu khong o `secrets.env`: mot
      # `service.name` cho MOI tien trinh la dieu kien de doc duoc "buoc nay chay o dau".
      OTEL_TRACING: ${OTEL_TRACING:-off}
      OTEL_SERVICE_NAME: nexagnet-api
      # GHI CUNG, khong phai bien — cung ly do voi `WORKFLOW_ENGINE_HOST_PORT`: dia chi collector
      # la mot su that ve TOPO cua chinh tep nay. Mot gia tri sai o `secrets.env` se tro telemetry
      # cua stack nay vao collector cua stack khac.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # KHOA INGESTION. Day la thu quyet dinh tai trong nay duoc ghi vao KHO NAO — receiver cua
      # collector tu choi neu sai. Khong co gia tri mac dinh: thieu khoa thi collector tra 401 va
      # telemetry bi bo, chu KHONG roi vao mot pipeline mac dinh nao (fail-closed, §8.1 dieu 2).
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      OTEL_PRISMA_DETAIL: ${OTEL_PRISMA_DETAIL:-operation}
      # DUONG DOC LICH SU cua Debug View — `api` -> ClickHouse, bang credential CHI DOC.
      #
      # CHIEU NGUOC voi bon bien tren: chung day telemetry RA, bon bien nay doc telemetry VE. Va
      # day la ly do duong doc nam o `api` chu khong o console: de console hoi thang ClickHouse la
      # de mot khoa kho quan sat di ra tan trinh duyet cua nguoi dung, va bo qua toan bo lop xac
      # thuc ma moi duong nghiep vu khac phai di qua.
      #
      # Endpoint GHI CUNG — cung ly do voi `OTEL_EXPORTER_OTLP_ENDPOINT`: dia chi kho la mot su
      # that ve TOPO cua chinh tep nay, va mot gia tri sai trong `secrets.env` se tro duong doc
      # cua stack nay vao kho cua stack khac. Cong 8123 = giao dien HTTP (9000 la giao thuc goc).
      CLICKHOUSE_READER_ENDPOINT: http://clickhouse:8123
      # User DOC, KHAC user ghi cua collector (§8.1 dieu 3). No chi co `GRANT SELECT` — xem
      # `init-observability.sql` trong `render-secrets.sh`. Thieu bat ky manh nao thi
      # `readClickHouseReaderConfig()` tra `null`, va Debug View noi ro la KHONG CO duong lui —
      # khong im lang bao "khong tim thay".
      CLICKHOUSE_READER_USER: ${CLICKHOUSE_READER_USER:-}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-}
    command:
      - sh
      - -ec
      - |
        apps/api/node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma
        # PRELOAD CHI DUOC GAN KHI BAT, va gan bang `--import` tren DONG LENH chu khong bang
        # `NODE_OPTIONS`. Hai ly do, ca hai deu tu mot cho:
        #   · `NODE_OPTIONS` ap cho MOI tien trinh node trong container — ke ca `prisma migrate`
        #     ngay tren, tuc mot tien trinh dan cung mo mot ket noi OTLP roi chet;
        #   · `--import` co dieu kien giu dung loi hua cua `otel-config.ts`: tat = tuyet doi khong
        #     nap SDK. `otel-preload.js` import ca do thi SDK o cap module, nen chi can no duoc nap
        #     la cai gia da phai tra, du `OTEL_TRACING=off`.
        if [ "${OTEL_TRACING:-off}" = 'on' ]; then
          exec node --import ./apps/api/dist/observability/otel/otel-preload.js apps/api/dist/main.js
        fi
        exec node apps/api/dist/main.js
    volumes:
      - ./.runtime/zalo:/runtime/zalo
      # DANH TINH BAN PHAT HANH. Mount theo TEP chu khong theo thu muc: `./.runtime` chua
      # `secrets.env`, va dua ca thu muc do vao mot tien trinh nghiep vu la dua toan bo bi mat
      # cua stack vao mot cho khong can chung.
      #
      # `deploy-remote.sh` ghi tep nay TRUOC khi stack duoc dua len. Thu tu do la dieu kien de
      # mount nay ton tai: Docker gap mot duong dan nguon chua ton tai thi tao ra mot THU MUC
      # trung ten, hong ca mount lan lan ghi ke tiep.
      - ./.runtime/release.json:/runtime/release.json:ro
      # `:ro` — goi khach la hat giong seed, tien trinh khong duoc ghi nguoc vao no.
      - ./tenant-pack:/srv/tenant:ro
      # `:ro` — anh catalog do buoc dung ngoai sinh ra; tien trinh chi DOC de phuc vu Zalo.
      - ./catalog-assets:/srv/catalog:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      backend:
        aliases:
          - api-${STACK_SLUG:-${TENANT_SLUG}}
      data:

  web:
    image: ${APP_IMAGE}
    # `always` (khong phai `unless-stopped`): stack phai tu quay lai ke ca sau khi ai do
    # `docker stop` thu cong roi VM reboot — yeu cau "he thong tren VM luon chay".
    restart: always
    environment:
      # Thuong hieu (tieu de trang, manifest PWA, icon) doc tu goi khach nay luc CHAY.
      # Xem chu thich o service `api` ve ly do dung TENANT_DIR thay vi TENANT.
      TENANT_DIR: /srv/tenant
    volumes:
      - ./tenant-pack:/srv/tenant:ro
    command:
      [
        "apps/web/node_modules/.bin/next",
        "start",
        "apps/web",
        "-p",
        "3000",
        "-H",
        "0.0.0.0"
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      backend:
        aliases:
          - web-${STACK_SLUG:-${TENANT_SLUG}}

  # ==========================================================================================
  # WORKFLOW ENGINE (Hatchet) — TOAN BO CUM NAY NAM SAU `profiles: ["workflow"]`.
  #
  # `zalo-ultty` (production) KHONG duoc moc them 6 container vi mot tinh nang chua ai bat.
  # Compose chi dung toi nhom nay khi co `--profile workflow`, va `deploy-stack.sh` chi truyen co
  # do khi `WORKFLOW_ENGINE=on`. Do la MOT NUA cua quyet dinh Q1-A; nua kia la cong tac trong
  # `apps/api/src/workflow/workflow-engine-switch.ts` (mac dinh `off`, ep boi ca W9-B1).
  #
  # KHONG COPY compose cua POC (`tools/poc-workflow-engine/compose/hatchet.compose.yml`). Ban do
  # co ba thu khong duoc phep len production, va ca ba deu co chu dich o CHO CUA NO:
  #   1. `ports:` publish 5744/7744/8744 ra host — nhieu khach tren mot VM se gianh cong nhau;
  #   2. mat khau `hatchet/hatchet` viet thang trong file;
  #   3. `SERVER_AUTH_COOKIE_INSECURE: "t"` — cookie phien cua dashboard mat co Secure.
  #
  # CACH LY (D3 se bien thanh test hop dong): MOI STACK MOT ENGINE RIENG. §26 da chung minh chay
  # duoc rang hai ban trien khai dung chung mot engine CUOP RUN cua nhau va gui du lieu cua nhau
  # ra ngoai — do la loi cach ly du lieu, khong phai bat tien van hanh. Nen:
  #   · `hatchet-postgres` va `hatchet-engine` chi nam tren `data` (`internal: true`);
  #   · KHONG service nao trong cum co khoi `ports:`;
  #   · volume khai o CHINH file nay => theo compose project => theo stack;
  #   · dia chi engine duoc GHI CUNG `hatchet-engine:7070`, khong phai mot bien moi truong.
  #
  # ⚠️ VOLUME `hatchet-config` QUAN TRONG NGANG POSTGRES CUA ENGINE. `hatchet-admin quickstart`
  # sinh cau hinh co KHOA MA HOA vao do. Mat volume nay = du lieu engine da ma hoa khong doc lai
  # duoc, ke ca khi restore Postgres thanh cong. Backup chi dump Postgres la BACKUP VO DUNG (D6).
  # ==========================================================================================

  hatchet-postgres:
    profiles: ["workflow"]
    # PostgreSQL RIENG cho engine, khong dung chung voi `postgres` cua nghiep vu. 15.6 (khac 16
    # cua nghiep vu) la CO Y: schema cua Hatchet do chinh ho migrate, va ghep chung hai vong doi
    # nang cap vao mot server la tu buoc minh nang cap ca hai cung luc.
    image: postgres:15.6@sha256:1ebd963e5c598f944a4e9ba27de4c95289d663dcc73731025aa53c5254094d8f
    restart: always
    # POC copy `max_connections=1000` tu compose chinh thuc cua Hatchet. DA DO tren engine that:
    # engine giu 20 ket noi (12 `server`, 4 `server:pubsub`, 2 `server:ddl`), 1 active. 200 la
    # 10x so do — con du bien khi v1 va v2 cung song luc DRAIN — ma khong bat VM tra cho 1000 khe
    # ket noi de phuc vu 10-20 don/ngay. D7 dem RAM bang so that, nen cho nay khong duoc phong tay.
    command: postgres -c 'max_connections=200'
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: ${HATCHET_DB_PASSWORD}
      POSTGRES_DB: hatchet
    volumes:
      - hatchet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d hatchet -U hatchet"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - data

  hatchet-migration:
    profiles: ["workflow"]
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:v0.101.27@sha256:fcac4e42fdd18d7bdb8dd9249019cb8c7a85393496f440f3d5309a2c9e38970f
    # MOT LAN roi thoat. `no` la mac dinh cua compose nhung viet ra day de khong ai doc nham thanh
    # "quen dat" — ca file nay khai `restart` tuong minh cho moi service.
    restart: "no"
    command: /hatchet/hatchet-migrate
    environment:
      DATABASE_URL: postgres://hatchet:${HATCHET_DB_PASSWORD}@hatchet-postgres:5432/hatchet
    depends_on:
      hatchet-postgres:
        condition: service_healthy
    networks:
      - data

  hatchet-setup-config:
    profiles: ["workflow"]
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.101.27@sha256:c5116b5c5b88d388c80423d69099436305cb0bfc088439133d1d55ecf51f56e3
    restart: "no"
    # `--overwrite=false` => CHAY LAI DUOC. Deploy lan hai khong duoc sinh lai khoa ma hoa: sinh
    # lai = moi thu da ma hoa bang khoa cu tro thanh rac, va trieu chung se la "engine len binh
    # thuong nhung khong doc duoc gi".
    # `--skip certs` di kem quyet dinh Q2-A (tls `none` tren mang `internal: true`). Volume
    # `hatchet-certs` van duoc mount du dang rong, de doi sang Q2-B sau nay khong phai chay lai
    # quickstart voi mot bo volume khac.
    command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config --overwrite=false
    environment:
      DATABASE_URL: postgres://hatchet:${HATCHET_DB_PASSWORD}@hatchet-postgres:5432/hatchet
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_PORT: "7070"
      # Dia chi nay duoc NHUNG VAO TOKEN luc quickstart, nen no phai la ten DNS NOI BO cua stack.
      # Neu de `localhost:7744` nhu POC thi token phat ra chi tro dung tren may dev.
      SERVER_GRPC_BROADCAST_ADDRESS: hatchet-engine:7070
      SERVER_GRPC_INSECURE: "t"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: hatchet-engine:7070
      SERVER_URL: https://${WORKFLOW_DOMAIN}
      SERVER_AUTH_COOKIE_DOMAIN: ${WORKFLOW_DOMAIN}
      SERVER_AUTH_COOKIE_INSECURE: "f"
      SERVER_SECURITY_CHECK_ENABLED: "false"
    volumes:
      - hatchet-certs:/hatchet/certs
      - hatchet-config:/hatchet/config
    depends_on:
      hatchet-migration:
        condition: service_completed_successfully
      hatchet-postgres:
        condition: service_healthy
    networks:
      - data

  hatchet-engine:
    profiles: ["workflow"]
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.101.27@sha256:b77689e3c9281284e29fee70e671d7e9c1bf5394b592e94d4f37e57c148afcd5
    restart: always
    command: /hatchet/hatchet-engine --config /hatchet/config
    environment:
      DATABASE_URL: postgres://hatchet:${HATCHET_DB_PASSWORD}@hatchet-postgres:5432/hatchet
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_PORT: "7070"
      SERVER_GRPC_BROADCAST_ADDRESS: hatchet-engine:7070
      # Q2-A: gRPC noi bo chay `insecure`. Luu luong nay KHONG roi mot mang Docker `internal: true`
      # tren mot VM — no khong di qua ranh gioi host nao. Ke tan cong phai da co root tren VM hoac
      # dang thuc thi ma trong mot container CUNG STACK; luc do TLS khong cuu duoc gi, con han cert
      # thi them mot che do hong moi ma khong co gi giam sat no. Rui ro ton du duoc ghi ra van ban
      # va D3 ep bang test: khong `ports:`, mang `internal: true`, dashboard chi ra ngoai qua edge.
      SERVER_GRPC_INSECURE: "t"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: hatchet-engine:7070
      SERVER_URL: https://${WORKFLOW_DOMAIN}
      SERVER_AUTH_COOKIE_DOMAIN: ${WORKFLOW_DOMAIN}
      SERVER_AUTH_COOKIE_INSECURE: "f"
      # Tat kiem tra phien ban tu xa: mot ban trien khai rieng cua khach khong goi ra Internet de
      # bao minh dang chay gi.
      SERVER_SECURITY_CHECK_ENABLED: "false"
    volumes:
      - hatchet-certs:/hatchet/certs
      - hatchet-config:/hatchet/config
    depends_on:
      hatchet-setup-config:
        condition: service_completed_successfully
    # Cong 8733 la may chu suc khoe RIENG cua engine — DA DO tren v0.101.27: `/live` va `/ready`
    # tra 200, `/health` tra 404. `wget` co san trong image (da kiem), nen khong phai them gi.
    # Neu mot ban sau nay tat may chu do mac dinh, healthcheck se do => container `unhealthy` =>
    # NHIN THAY DUOC. Do la huong hong dung.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:8733/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - data

  hatchet-dashboard:
    profiles: ["workflow"]
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:v0.101.27@sha256:3fec32e19a90361af1b2a7c1a0d59886ac0fe1aaee69fe3a03bcd8890c23da66
    restart: always
    command: sh ./entrypoint.sh --config /hatchet/config
    environment:
      DATABASE_URL: postgres://hatchet:${HATCHET_DB_PASSWORD}@hatchet-postgres:5432/hatchet
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_GRPC_BROADCAST_ADDRESS: hatchet-engine:7070
      SERVER_GRPC_INSECURE: "t"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: hatchet-engine:7070
      SERVER_URL: https://${WORKFLOW_DOMAIN}
      SERVER_AUTH_COOKIE_DOMAIN: ${WORKFLOW_DOMAIN}
      # TLS ket thuc tai Caddy; giua edge va container nay la mang Docker. KHAC POC o dung cho
      # nay: `f` bat co Secure tren cookie phien, nen cookie khong bao gio roi ra Internet tran.
      SERVER_AUTH_COOKIE_INSECURE: "f"
      SERVER_SECURITY_CHECK_ENABLED: "false"
    volumes:
      - hatchet-certs:/hatchet/certs
      - hatchet-config:/hatchet/config
    depends_on:
      hatchet-setup-config:
        condition: service_completed_successfully
    # Image nay chay HAI tien trinh (da kiem bang `ps` trong container): `hatchet-api` tren :8080
    # va nginx tren :80 phuc vu giao dien + proxy `/api`. Nen edge chi can tro toi :80.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      backend:
        aliases:
          # Edge di NGUOC vao mang cua khach roi goi bang alias mang slug — cung khuon
          # `api-`/`web-`/`flowise-`. Goi bang TEN SERVICE se lap lai su co 17/08/2026: tren mot
          # mang ma edge tham gia, moi khach deu tra loi cho cung cai ten `hatchet-dashboard`.
          - hatchet-${STACK_SLUG:-${TENANT_SLUG}}
      data:

  workflow-worker-v1:
    profiles: ["workflow"]
    # CUNG IMAGE voi `api`, KHAC LENH CHAY. Mot container = MOT phien ban khuon.
    #
    # TEN SERVICE MANG PHIEN BAN, va do la dieu kien de thu tuc DRAIN cua runbook §2 dung duoc:
    # `workflow-worker-v1` va `workflow-worker-v2` phai CUNG SONG trong khi
    # REGISTER -> ACTIVATE -> DRAIN (countInFlight(v1)=0) -> DEACTIVATE -> REMOVE chay het. Neu
    # ten service khong mang phien ban thi nang cap khuon = huy container dang phuc vu, va moi run
    # `.v1` dang do se nam cho vinh vien.
    image: ${APP_IMAGE}
    restart: always
    depends_on:
      hatchet-engine:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Goi khach mount ngoai image — cung ly do da ghi o service `api`.
      TENANT_DIR: /srv/tenant
      WORKFLOW_ENGINE: ${WORKFLOW_ENGINE:-off}
      WORKFLOW_ENGINE_TOKEN: ${WORKFLOW_ENGINE_TOKEN:-}
      # GHI CUNG, khong phai bien: dia chi engine la mot su that ve TOPO cua chinh file nay, va
      # de no thanh bien chinh la lo hong ma D3 phai dong — mot gia tri sai o secrets.env se tro
      # hai stack vao cung mot engine, dung che do hong da do o §26.
      WORKFLOW_ENGINE_HOST_PORT: hatchet-engine:7070
      WORKFLOW_ENGINE_TLS_STRATEGY: none
      WORKFLOW_ENGINE_NAMESPACE: ${WORKFLOW_ENGINE_NAMESPACE:-}
      # Bat buoc, khong co mac dinh: thieu no thi tien trinh NEM luc boot chu khong song ma
      # khong dang ky khuon nao (`resolveWorkerRegistration`).
      WORKFLOW_WORKER_VERSION: v1
      # GHI TUONG MINH du dang bang dung mac dinh cua `resolveWorkerRegistration`.
      #
      # Tu 25/08/2026 stack co HAI worker mang HAI khuon khac nhau. Mot mac dinh ngam con doc
      # duoc khi chi co mot khuon; khi da co hai thi cau hoi "container nay phuc vu khuon nao"
      # phai tra loi duoc bang CHINH file nay, khong phai bang cach mo code ra tra cuu xem hang
      # so mac dinh dang tro vao dau.
      WORKFLOW_WORKER_TEMPLATE: integration-handoff
      WORKFLOW_WORKER_HEALTH_PORT: "8085"
      # KHOA DICH VU de goi nguoc `internal/*` cua `api`. Cung gia tri ma service `api` nhan
      # (dong 183) — o `AUTH_MODE=session` day la thu DUY NHAT worker mang duoc: no khong co
      # cookie, khong co phien va khong co token CSRF. Thieu bien nay thi workflow chay tron
      # nhung moi lan goi ve deu 401.
      API_KEY: ${API_KEY}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      TELEMETRY_PRIVACY: ${TELEMETRY_PRIVACY:-}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-}
      RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-}
      RELEASE_APP_DIGEST: ${RELEASE_APP_DIGEST:-}
      RELEASE_DEPLOYED_AT: ${RELEASE_DEPLOYED_AT:-}
      # Worker doc danh tinh release qua CUNG MOT ham voi `api` (`resolveReleaseIdentity`), va
      # `tenant` cua no la MOT CHIEU CUA KHOA THAO TAC (`buildOperationKey`). Bo mount o day thi
      # hai tien trinh cua cung mot stack se tra loi khac nhau cho cung mot cau hoi.
      RELEASE_MANIFEST_PATH: /runtime/release.json
      # QUAN SAT BEN (OTel -> Collector -> ClickHouse). Cong tac DUY NHAT la `OTEL_TRACING`, va
      # mac dinh cua no la `off` o `otel-config.ts` — tat = khong SDK nao duoc nap, khong mot byte
      # nao roi khoi tien trinh. Xem `docs/kien-truc/reference-platform-stack.md` §8.
      #
      # `OTEL_SERVICE_NAME` DAT RIENG cho tung service o day chu khong o `secrets.env`: mot
      # `service.name` cho MOI tien trinh la dieu kien de doc duoc "buoc nay chay o dau".
      OTEL_TRACING: ${OTEL_TRACING:-off}
      OTEL_SERVICE_NAME: nexagnet-workflow-worker-v1
      # GHI CUNG, khong phai bien — cung ly do voi `WORKFLOW_ENGINE_HOST_PORT`: dia chi collector
      # la mot su that ve TOPO cua chinh tep nay. Mot gia tri sai o `secrets.env` se tro telemetry
      # cua stack nay vao collector cua stack khac.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # KHOA INGESTION. Day la thu quyet dinh tai trong nay duoc ghi vao KHO NAO — receiver cua
      # collector tu choi neu sai. Khong co gia tri mac dinh: thieu khoa thi collector tra 401 va
      # telemetry bi bo, chu KHONG roi vao mot pipeline mac dinh nao (fail-closed, §8.1 dieu 2).
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      OTEL_PRISMA_DETAIL: ${OTEL_PRISMA_DETAIL:-operation}
    # Cung ly do voi `api`: `--import` CO DIEU KIEN, khong phai `NODE_OPTIONS`.
    command:
      - sh
      - -ec
      - |
        if [ "${OTEL_TRACING:-off}" = 'on' ]; then
          exec node --import ./apps/api/dist/observability/otel/otel-preload.js apps/api/dist/workflow/worker-main.js
        fi
        exec node apps/api/dist/workflow/worker-main.js
    volumes:
      - ./tenant-pack:/srv/tenant:ro
      # Mount theo TEP: `./.runtime` chua `secrets.env`, con worker thi khong can gi trong do.
      - ./.runtime/release.json:/runtime/release.json:ro
    # KHONG CO `ports:` — co y, va `worker-health.server.ts` ghi ro dieu do: may chu suc khoe nghe
    # 127.0.0.1 BEN TRONG container vi healthcheck cua Docker cung chay ben trong. Mot khoi
    # `ports:` o day se mo cho tu moi container khac tren stack vao.
    #
    # `start_period: 90s` la BIEN AN TOAN, khong phai so do readiness: no phai bao duoc lan do te
    # nhat cua §29 (38 s cho CA tien trinh len — nap SDK, boot Nest, ket noi), chu khong phai cua
    # so hep 316-343 ms giua `hatchet.worker()` va `waitUntilReady()`.
    #
    # `/ready` 200 CHI khi READY (va DEGRADED trong thoi gian an han). Mat engine sau READY thi
    # tien trinh KHONG thoat — Compose khong tu restart container `unhealthy`, nen cap gia tri nay
    # cho ra HONG NHIN THAY DUOC ma khong phai mot con bao restart.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8085/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s
    networks:
      # `data` de goi engine. `backend` KHONG phai cho tien: `data` khai `internal: true` nen mot
      # container chi nam tren do KHONG CO duong ra Internet, ma cac buoc ban giao phai goi duoc
      # diem cuoi ben ngoai (`WORKFLOW_DESTINATION_*`, D5) va diem cuoi trung lap cua D9.
      # Do la ly do DUY NHAT worker co mat tren `backend` — dung xoa vi thay "khong dung toi".
      - backend
      - data

  workflow-worker-sales-handoff-v1:
    profiles: ["workflow"]
    # ==========================================================================================
    # CONTAINER THU HAI, va no PHAI la mot container thu hai.
    #
    # `worker-registration.ts` ghi ro: engine dinh tuyen viec theo `actionId = <tenWorkflow>:
    # <tenBuoc>`, va mot worker chi nhan viec cua action CHINH NO dang ky. Mot tien trinh om ca
    # `integration-handoff` lan `sales-handoff-followup` se lam duong bien giua hai khuon tan
    # bien — va cung khong nang cap rieng tung khuon duoc nua.
    #
    # He qua thuc te, khong phai ly thuyet: hai khuon co nhip song KHAC HAN nhau.
    # `sales-handoff-followup` NGU nhieu ngay (`durableTask` + `sleepFor`), con
    # `integration-handoff` chay xong trong vai giay. Gop chung mot container thi mot lan DRAIN
    # cua khuon nhanh phai doi khuon cham ngu day.
    #
    # HAI KHUON = HAI CONTAINER = HAI vong REGISTER -> ACTIVATE -> DRAIN -> DEACTIVATE -> REMOVE
    # doc lap. `workflow-isolation.contract.test.mjs` giu dung dieu do.
    # ==========================================================================================
    image: ${APP_IMAGE}
    restart: always
    depends_on:
      hatchet-engine:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Goi khach mount ngoai image. Worker nay THUC SU doc no: nguong "viec ban giao bi bo quen"
      # (`tenantSalesHandoffFollowup()`) la chinh sach cua KHACH, doc mot lan luc dang ky khuon.
      TENANT_DIR: /srv/tenant
      WORKFLOW_ENGINE: ${WORKFLOW_ENGINE:-off}
      WORKFLOW_ENGINE_TOKEN: ${WORKFLOW_ENGINE_TOKEN:-}
      # GHI CUNG — cung ly do da ghi o `workflow-worker-v1`: mot bien o day cho phep hai stack
      # cung tro vao MOT engine, dung che do hong cua §26.
      WORKFLOW_ENGINE_HOST_PORT: hatchet-engine:7070
      WORKFLOW_ENGINE_TLS_STRATEGY: none
      WORKFLOW_ENGINE_NAMESPACE: ${WORKFLOW_ENGINE_NAMESPACE:-}
      # HAI BIEN NAY LA CA DIEM CUA SERVICE. Khuon phai ghi TUONG MINH: mac dinh cua
      # `resolveWorkerRegistration` la `integration-handoff`, nen thieu dong duoi thi container
      # nay lang le tro thanh mot worker `integration-handoff` THU HAI — no van len xanh, van
      # healthy, va khong run `sales-handoff-followup` nao co nguoi phuc vu.
      WORKFLOW_WORKER_TEMPLATE: sales-handoff-followup
      WORKFLOW_WORKER_VERSION: v1
      # Cong RIENG. Dung chung 8085 voi `workflow-worker-v1` thi mot trong hai tien trinh nem
      # `WORKFLOW_WORKER_HEALTH_PORT_UNAVAILABLE` luc boot — o day moi worker la mot container
      # nen khong gian mang tach roi, nhung van dat khac nhau de mot lan chay chung mang (harness
      # test, may dev) khong bien thanh mot loi kho doc.
      WORKFLOW_WORKER_HEALTH_PORT: "8086"
      # DICH DEN NOI BO — `self-api` la ten logic trong goi khach; day la anh xa ten -> URL that.
      #
      # `api:3001` chu khong phai `3001` cua host: worker goi THANG qua mang Docker cua khach,
      # KHONG di qua Caddy. `caddy-route-contract.test.mjs` giu mot khang dinh PHU DINH rang
      # `internal/*` phai VANG MAT khoi matcher cua edge — cong duong nay ra Internet la bien mot
      # endpoint GHI trang thai don hang thanh thu ai cung goi duoc.
      #
      # PORT phai khop `PORT: 3001` cua service `api` (dong 137). Sai port o day thi workflow
      # chay tron nhung moi lan goi ve deu that bai o tang mang.
      WORKFLOW_DESTINATION_SELF_API: http://api:3001/internal/sales-handoff
      # KHOA DICH VU. O `AUTH_MODE=session` day la thu DUY NHAT worker mang duoc: no khong co
      # cookie, khong co phien, khong co token CSRF. `InternalServiceGuard` FAIL-CLOSED, nen
      # thieu bien nay = workflow chay tron va moi lan goi ve deu 401.
      API_KEY: ${API_KEY}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      TELEMETRY_PRIVACY: ${TELEMETRY_PRIVACY:-}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-}
      RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-}
      RELEASE_APP_DIGEST: ${RELEASE_APP_DIGEST:-}
      RELEASE_DEPLOYED_AT: ${RELEASE_DEPLOYED_AT:-}
      # Worker doc danh tinh release qua CUNG MOT ham voi `api` (`resolveReleaseIdentity`), va
      # `tenant` cua no la MOT CHIEU CUA KHOA THAO TAC (`buildOperationKey`). Bo mount o day thi
      # hai tien trinh cua cung mot stack se tra loi khac nhau cho cung mot cau hoi.
      RELEASE_MANIFEST_PATH: /runtime/release.json
      # QUAN SAT BEN (OTel -> Collector -> ClickHouse). Cong tac DUY NHAT la `OTEL_TRACING`, va
      # mac dinh cua no la `off` o `otel-config.ts` — tat = khong SDK nao duoc nap, khong mot byte
      # nao roi khoi tien trinh. Xem `docs/kien-truc/reference-platform-stack.md` §8.
      #
      # `OTEL_SERVICE_NAME` DAT RIENG cho tung service o day chu khong o `secrets.env`: mot
      # `service.name` cho MOI tien trinh la dieu kien de doc duoc "buoc nay chay o dau".
      OTEL_TRACING: ${OTEL_TRACING:-off}
      OTEL_SERVICE_NAME: nexagnet-workflow-worker-sales-handoff-v1
      # GHI CUNG, khong phai bien — cung ly do voi `WORKFLOW_ENGINE_HOST_PORT`: dia chi collector
      # la mot su that ve TOPO cua chinh tep nay. Mot gia tri sai o `secrets.env` se tro telemetry
      # cua stack nay vao collector cua stack khac.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # KHOA INGESTION. Day la thu quyet dinh tai trong nay duoc ghi vao KHO NAO — receiver cua
      # collector tu choi neu sai. Khong co gia tri mac dinh: thieu khoa thi collector tra 401 va
      # telemetry bi bo, chu KHONG roi vao mot pipeline mac dinh nao (fail-closed, §8.1 dieu 2).
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      OTEL_PRISMA_DETAIL: ${OTEL_PRISMA_DETAIL:-operation}
    # Cung ly do voi `api`: `--import` CO DIEU KIEN, khong phai `NODE_OPTIONS`.
    command:
      - sh
      - -ec
      - |
        if [ "${OTEL_TRACING:-off}" = 'on' ]; then
          exec node --import ./apps/api/dist/observability/otel/otel-preload.js apps/api/dist/workflow/worker-main.js
        fi
        exec node apps/api/dist/workflow/worker-main.js
    volumes:
      - ./tenant-pack:/srv/tenant:ro
      # Mount theo TEP: `./.runtime` chua `secrets.env`, con worker thi khong can gi trong do.
      - ./.runtime/release.json:/runtime/release.json:ro
    # KHONG CO `ports:`, va KHONG CO `DATABASE_URL` — hai dieu nay la co y.
    #
    # `WorkflowWorkerModule` khong duoc cap Prisma: no boot mot module HEP chu khong phai
    # `AppModule`, vi `AppModule` se mo mot listener zca THU HAI tren cung tai khoan Zalo va da
    # ra listener cua `api` — kenh doc chinh cua GD1 chet vi mot container phu khoi dong. Worker
    # doc trang thai nghiep vu bang cach GOI NGUOC API qua `internal/*`, khong cham DB.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8086/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s
    networks:
      # Giong `workflow-worker-v1`: `data` de goi engine, `backend` de goi `api` (dich den
      # `self-api`). `data` khai `internal: true` nen mot container chi nam tren do khong goi
      # duoc service nao ngoai cum engine.
      - backend
      - data

  # ============================================================================================
  # CUM QUAN SAT (OTel Collector + ClickHouse) — TOAN BO NAM SAU `profiles: ["observability"]`.
  #
  # Cung ly do voi cum Hatchet: `zalo-ultty` (production) KHONG duoc moc them container vi mot
  # nang luc chua ai bat. Compose chi dung toi nhom nay khi co `--profile observability`.
  #
  # VI SAO KHO NAM TRONG COMPOSE CUA TUNG KHACH (reference-platform-stack §8.4): trace mang noi
  # dung nghiep vu va co the mang du lieu ca nhan, nen no la DU LIEU CUA TENANT. Dat chung mot cum
  # roi phan quyen se dua cach ly ve lai thanh cau hinh phan quyen — mot lenh `GRANT` sai la ro ri
  # cheo khach. Gia phai tra la RAM/dia nhan theo so tenant, va do la gia duoc chap nhan co y thuc.
  #
  # XOA TENANT LA XOA KHO: volume nam trong chinh compose project cua stack do.
  # ============================================================================================
  clickhouse:
    profiles: ["observability"]
    # GHIM THEO DIGEST, cung quy uoc voi cum Hatchet: mot tag co the bi day sang anh khac, va
    # luc do khong lan lai duoc "ban nao dang chay". 25.3 la ban LTS.
    image: clickhouse/clickhouse-server:25.3-alpine@sha256:a4e8cf46e526a06f4f52d22f7fa8d07472b55d3c896d7ca3f159e249be38ae62
    restart: always
    environment:
      # User GHI. `clickhouseexporter` dung dung user nay; user DOC duoc tao rieng trong
      # `init-observability.sql` voi quyen SELECT, va do la hai credential khac nhau CO CHU Y
      # (§8.1 dieu 3: credential ghi va credential doc tach nhau).
      CLICKHOUSE_USER: ${CLICKHOUSE_WRITER_USER:-observability_writer}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-observability}
      # Dat mot trong ba bien tren khien entrypoint ghi `users.d/default-user.xml`, va tep do
      # XOA user `default` (`<default remove="remove">`). Do la thu ta muon: user `default` khong
      # mat khau tren mot mang co container khac la mot cua mo vao toan bo telemetry.
      #
      # HAI TEN BIEN, CO Y: entrypoint doi ten bien nay giua cac doi anh (`CLICKHOUSE_ACCESS_
      # MANAGEMENT` -> `CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT`). Dat ca hai la re; dat sai ten thi
      # user ghi khong co quyen `CREATE USER`, va `init-observability.sql` that bai — tuc user DOC
      # khong bao gio ton tai, va duong doc cua Debug View chet ma khong ai biet vi sao.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Chay MOT LAN, luc thu muc du lieu con rong. `render-secrets.sh` dung tep nay (no chua mat
      # khau cua user doc), nen no di duong `.runtime/` giong `secrets.env` — khong bao gio vao repo.
      - ./.runtime/init-observability.sql:/docker-entrypoint-initdb.d/10-observability.sql:ro
    # KHONG CO `ports:` — kho quan sat khong duoc mo ra host. Ai can nhin thi di qua `api`
    # (duong doc da xac thuc) hoac `docker exec`.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      # CHI `data` (`internal: true`). Kho quan sat khong can — va khong duoc — co duong ra Internet.
      - data

  otel-collector:
    profiles: ["observability"]
    # `-contrib` chu khong phai anh `core`: `bearertokenauthextension` va `clickhouseexporter`
    # deu chi co trong ban contrib. Ghim theo digest.
    image: otel/opentelemetry-collector-contrib:0.130.1@sha256:9c247564e65ca19f97d891cca19a1a8d291ce631b890885b44e3503c5fdb3895
    restart: always
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      # Collector khai trien `${env:...}` trong cau hinh, nen mat khau ghi den tu day chu khong
      # bao gio nam trong tep YAML.
      CLICKHOUSE_WRITER_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD:-}
    volumes:
      # Cau hinh DUOC DUNG THEO STACK tu khuon (`observability/render-otel-collector.sh`). Ten
      # receiver/exporter/pipeline deu mang slug cua stack, nen khong ton tai duong tu tenant nay
      # sang kho cua tenant kia — xem `observability-isolation.contract.test.mjs`.
      - ./.runtime/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      # KHOA INGESTION doc tu TEP, khong tu bien moi truong: bien moi truong lo ra trong
      # `docker inspect`, con tep thi khong.
      - ./.runtime/otlp-keys:/run/otlp-keys:ro
    # KHONG CO `ports:` — chi cac container tren `data` moi gui duoc telemetry vao. Cong OTLP mo
    # ra host la mot duong ghi vao kho quan sat cua khach cho bat ky ai cham toi VM.
    #
    # KHONG CO `healthcheck:` — va day KHONG phai thieu sot. Anh nay dung tu `scratch`: ba lop,
    # chi co `/otelcol-contrib`, chung chi CA va tep cau hinh. Khong shell, khong `wget`, khong
    # `curl`. Mot `healthcheck` goi bat ky thu nao trong so do se do VINH VIEN, va voi
    # `up --wait` thi do la mot lan deploy that bai vi mot cong khong the xanh.
    #
    # Suc khoe VAN duoc kiem — tu mot container KHAC tren cung mang `data`, trong
    # `deploy-stack.sh`. Doc tu ben ngoai la dung ban chat cua mot cong suc khoe hon.
    networks:
      - data

volumes:
  postgres-data:
  # `flowise-data` khai trong `compose.flowise.yaml` cung voi service dung no.
  # Ba volume cua engine. CA BA deu phai vao backup (D6), khong chi cai dau: `hatchet-config` giu
  # khoa ma hoa, nen dump Postgres ma mat config thi restore ra du lieu khong giai ma duoc.
  hatchet-postgres-data:
  hatchet-config:
  hatchet-certs:
  # Kho quan sat cua CHINH stack nay. Xoa stack (`down -v`) la xoa luon trace cua khach do —
  # dung dieu §8.5 hua: "xoa mot tenant thi trace di cung stack cua tenant".
  clickhouse-data:

networks:
  # KHONG khach nao dung chung mang voi khach nao.
  #
  # Ban dau api/web/flowise duoc noi vao mot mang `netviet-edge` dung chung. Do la mot LO HONG:
  # Docker tu dang ky TEN SERVICE lam alias DNS tren MOI mang container tham gia, nen tren mang do
  # ca hai khach deu tra loi cho cung cai ten `api`/`web`/`flowise`. Ket qua (17/08/2026): api cua
  # khach nay phan giai `flowise` ra HAI dia chi va noi nham sang Flowise cua khach kia -> 404.
  # Ngoai sai dia chi, no con cho container hai khach goi thang duoc sang nhau.
  #
  # Nay tung khach dong kin trong `backend`/`data` cua rieng minh; edge di NGUOC vao bang
  # `docker network connect` luc deploy (xem deploy-remote.sh) va goi khach qua alias mang slug.
  backend:
  data:
    internal: true
