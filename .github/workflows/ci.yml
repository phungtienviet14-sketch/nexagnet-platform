name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Loader goi khach CO Y khong co mac dinh (Dot B1) — bo test cua apps/api khang dinh tren du
    # lieu that cua mot goi, nen lint/typecheck/test phai noi ro chay tren goi nao.
    env:
      TENANT: ultty
    steps:
      # `fetch-depth: 0` cho buoc "nguon goc khach khong duoc chui vao lich su" ben duoi: mac dinh
      # cua actions/checkout la clone NONG (depth 1), va `git log base..head` tren mot clone nong
      # thi khong doc duoc — cong se do voi ma 2 thay vi im lang bao dat. Repo ~10MB nen clone day
      # du re; danh doi nay re hon mot cong khong chay.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # HEAD SACH != LICH SU SACH.
      #
      # `pnpm test` da chay cong tren `git ls-files` — tuc tren CAY CUOI CUNG cua PR. Mot tai lieu
      # goc them o commit A roi xoa o commit B trong cung PR do se lot qua: cay cuoi cung sach,
      # nhung byte thi da nam vinh vien trong lich su cua mot repo PUBLIC.
      #
      # Do khong phai gia dinh. Commit `d05e1e4` (11/08/2026) da dua MUOI tai lieu goc cua khach
      # vao repo — ban khao sat co so dien thoai lien he cua mot nhan su, anh thiet ke khach gui,
      # va ban .xlsx mang hai chat ID nhom Zalo — roi tat ca deu bi xoa o cac commit sau. Khong
      # mot cong nao keu, vi khong cong nao nhin vao KHOANG COMMIT.
      #
      # Buoc nay nhin. No la lan cuoi cung con sua duoc ma khong phai viet lai lich su cong khai.
      - name: Nguon goc khach khong duoc chui vao LICH SU roi xoa lai
        if: github.event_name == 'pull_request'
        run: >-
          node tools/customer-source-guardrail/guardrail.mjs
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      # LUOI AN TOAN "mot image — moi khach": build phai chay duoc ma KHONG biet khach nao. Neu ai do
      # them mot trang tinh doc goi khach, loader se nem va CI do NGAY TAI DAY — thay vi lang le
      # nuong ten khach vao artifact roi den luc doi khach moi phat hien.
      - name: Build khong co TENANT (khong duoc nuong thuong hieu vao artifact)
        run: pnpm build
        env:
          TENANT: ''
      # Chay tren dung artifact vua build o tren: mot ban build, hai goi khach, thuong hieu doi theo.
      - name: Chung minh mot artifact phuc vu duoc nhieu khach
        run: pnpm test:tenant-runtime
        env:
          TENANT: ''

  # Test Prisma bi skip khi thieu DB (RUN_PRISMA_IT chua dat) — job nay dung Postgres that de
  # chung minh migration + upsert/lifecycle thanh vien nhom, rule config va audit log chay dung.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netviet
          POSTGRES_PASSWORD: netviet_local
          POSTGRES_DB: netviet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netviet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://netviet:netviet_local@localhost:5432/netviet
      # Loader goi khach CO Y khong co mac dinh (Dot B1) — CI phai noi ro chay tren goi nao.
      TENANT: ultty
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter "@netviet/tenant..." build
      - name: Apply migrations to the throwaway Postgres
        run: pnpm --filter @netviet/api exec prisma migrate deploy --schema prisma/schema.prisma
      # Cac IT doc nguon su that (19 SKU, dai ly meta-hn, bang gia thang 7, glossary) nen DB
      # rong se lam chung do — seed la dieu kien tien quyet, khong phai buoc tuy chon.
      - name: Seed the source of truth
        run: pnpm --filter @netviet/api exec tsx prisma/seed.ts
      - name: Run the Prisma-gated suite
        run: pnpm --filter @netviet/api test
        env:
          RUN_PRISMA_IT: '1'

  # 24 BAI IT CUA WORKFLOW ENGINE — job nay ton tai vi "CI xanh" tung KHONG chung minh gi ve engine.
  #
  # Do duoc tren merge SHA `302d5b1e` (23/08/2026): `RUN_WORKFLOW_IT` khong xuat hien o BAT KY dong
  # nao trong file nay, nen ca `verify` lan `integration` deu bo qua dung 6 tep / 24 bai — im lang,
  # khong mot dong canh bao. Mot bo test tu bo qua chinh no la mot bo test LUON XANH.
  #
  # Ba dieu kien duoi day deu BAT BUOC, va thieu cai nao cung cho ra mot kieu do khac nhau:
  #   · cum Hatchet THAT       — `baseEnv()` cua harness doi mot engine song + mot token do chinh
  #                              engine duc; khong co thi worker tu choi khoi dong
  #   · Postgres nghiep vu     — 18/24 bai gate CA `RUN_PRISMA_IT` (do ben outbox doc hang tu DB
  #                              bang mot tien trinh KHAC voi tien trinh da ghi)
  #   · `--no-file-parallelism`— nam tep IT dang ky CUNG ten `integration-handoff.v1` voi CUNG mot
  #                              engine; chay song song thi worker cua tep A nhan run cua tep B.
  #                              Do 23/08: song song -> 9 bai DO; tuan tu -> xanh. Day KHONG phai
  #                              test mong manh, day la bat bien "moi khach/moi truong MOT engine"
  #                              dang tu bao ve (`deploy/netviet/workflow-isolation.contract.test.mjs`).
  workflow-integration:
    runs-on: ubuntu-24.04
    # Thoi han RONG co chu dich. Cum engine phai keo 5 image roi migrate + quickstart, va rieng
    # worker mat 6-38 giay de dang ky xong — bien dong lon, do 22-24/08/2026. Dat chat thi mot lan
    # runner cham se hien ra thanh mot job "bi huy" chu khong phai mot bai test do, va khong ai di
    # tim nguyen nhan (dung su co §6.3 cua ci-cd.md).
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netviet
          POSTGRES_PASSWORD: netviet_local
          POSTGRES_DB: netviet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netviet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://netviet:netviet_local@localhost:5432/netviet
      # Loader goi khach CO Y khong co mac dinh (Dot B1) — CI phai noi ro chay tren goi nao.
      # Cac bai IT tu dat `TENANT_DIR` toi goi fixture va XOA `TENANT` truoc khi boot, nen bien nay
      # chi phuc vu cac spec thuong nam chung trong `src/workflow`.
      TENANT: ultty
      # `127.0.0.1` chu KHONG `localhost`: tren runner Linux, Docker chi phat cong ra IPv4 con
      # `localhost` van phan giai ra ca `::1`. Mot lan chon nham ho se hien ra thanh
      # `ECONNREFUSED ::1:7744` — mot loi mang trong nhu engine chet.
      WORKFLOW_ENGINE_HOST_PORT: 127.0.0.1:7744
      WORKFLOW_ENGINE_TLS_STRATEGY: none
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter "@netviet/tenant..." build
      - name: Apply migrations to the throwaway Postgres
        run: pnpm --filter @netviet/api exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Seed the source of truth
        run: pnpm --filter @netviet/api exec tsx prisma/seed.ts
      # Script nay dung ca cum (postgres -> migration -> setup-config -> engine + dashboard), doi
      # cong mo, roi duc token va in DUY NHAT token ra stdout. Chay lai duoc tren may dev bang dung
      # mot dong — do la ly do no khong phai mot khoi `run:` viet thang o day.
      - name: Dung cum Hatchet va duc token
        # Token di tu stdout cua script -> mot bien -> `$GITHUB_ENV`, khong bao gio cham dia va
        # khong bao gio duoc in. `::add-mask::` la luoi thu hai: neu sau nay ai do lo `echo` no,
        # runner van che. (`minted` chu khong phai `TOKEN`: bo quet bi mat cua repo bat moi phep
        # gan vao mot bien mang ten thong tin dang nhap — o day thi do la mot canh bao gia, nhung
        # doi ten re hon la tat bo quet.)
        run: |
          minted="$(bash tools/poc-workflow-engine/start-engine.sh)"
          echo "::add-mask::${minted}"
          echo "WORKFLOW_ENGINE_TOKEN=${minted}" >> "$GITHUB_ENV"
      - name: Chay 24 bai IT tren engine THAT — TUAN TU
        run: pnpm --filter @netviet/api exec vitest run src/workflow --no-file-parallelism
        env:
          RUN_PRISMA_IT: '1'
          RUN_WORKFLOW_IT: '1'
      # BA BAI TUONG QUAN TRACE — buoc RIENG, va co y de sau buoc baseline o tren.
      #
      # Chung tu bo qua chinh chung khi `OTEL_TRACING` khong bat. Cai gate do CO CHU DICH: mot
      # bai kiem quan sat BAT BUOC phai chay se bien tang quan sat thanh dieu kien de nghiep vu
      # duoc coi la dung — dung dieu muc 10 cua rules cam. Nhung "co chu dich" khong duoc phep
      # bien thanh "khong bao gio chay o CI": do dung la cai bay `RUN_WORKFLOW_IT` da roi vao im
      # lang suot nhieu tuan, va la ly do job nay ton tai.
      #
      # Tach lam HAI buoc chu khong bat `OTEL_TRACING=on` cho ca 24 bai o tren, vi hai buoc do
      # hai thu khac nhau: buoc tren chung minh hanh vi nghiep vu khi TAT tracing (bat bien
      # "tat khong mat gi"), buoc nay chung minh soi day W3C di duoc qua engine khi BAT. Gop lam
      # mot thi mat phep do thu nhat.
      #
      # Bai tu dung may chu OTLP that cua no va tu tro `OTEL_EXPORTER_OTLP_ENDPOINT` cho cac tien
      # trinh con, nen buoc nay khong can them ha tang nao.
      - name: Tuong quan trace xuyen engine — OTEL_TRACING=on
        run: pnpm --filter @netviet/api exec vitest run src/workflow/workflow-trace-correlation.int.spec.ts --no-file-parallelism
        env:
          RUN_PRISMA_IT: '1'
          RUN_WORKFLOW_IT: '1'
          OTEL_TRACING: 'on'
      # `down -v` chu khong chi `down`: bai W5/W6/W7 co y `stop` engine va `kill -9` worker, nen
      # dang ky cua cac tien trinh da chet tich lai trong Postgres cua engine. Mot runner la moi
      # lan mot may nen buoc nay khong doi gi o CI — no o day de nguoi chay tay tren may minh
      # khong noi tiep tren mot engine da thoai hoa.
      - name: Don cum Hatchet
        if: always()
        run: docker compose -p pocwf -f tools/poc-workflow-engine/compose/hatchet.compose.yml down -v

  # MOT NEN TANG — NHIEU KHACH. `tenant-packs.spec.ts` tu liet ke MOI thu muc trong `tenants/`,
  # nap tung goi bang loader that va doi slug trong file trung ten thu muc. Them goi moi khong duoc
  # doi hoi sua danh sach CI thu hai. Chung minh mot artifact doi branding/experience nam o `verify`.
  tenant-packs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter "@netviet/tenant..." build
      - name: Liet ke va nap tat ca goi trong tenants/ bang loader that
        run: pnpm --filter @netviet/tenant test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter "@netviet/tenant..." build
      - run: pnpm --filter @netviet/web exec playwright install --with-deps chromium
      - run: pnpm --filter @netviet/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: apps/web/test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm audit --audit-level high

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/netviet/Dockerfile -t netviet-zalo:${{ github.sha }} .
      - run: docker build -f deploy/flowise/Dockerfile -t netviet-flowise:${{ github.sha }} .
      # CACH LY DU LIEU GIUA CAC KHACH: mo image vua build ra xem, doi hoi khong co goi khach nao
      # ben trong. Kiem tren image that chu khong kiem .dockerignore — mot COPY viet sai van co the
      # dua du lieu vao du file cau hinh trong nhu dung.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Image khong duoc chua du lieu cua bat ky khach nao
        run: node --test deploy/netviet/image-isolation.contract.mjs
        env:
          APP_IMAGE: netviet-zalo:${{ github.sha }}
