name: Nexagent Autopilot Autofix

# PoC buoc 3 — dung lai bang App token cai blocker cu cua POC-2:
#   CI FAIL (autopilot-sandbox-check do)
#     -> fixer sua tep trong sandbox
#     -> App push commit moi
#     -> CI tren HEAD moi TU chay, khong ai bam Approve
#     -> XANH
#
# VI SAO FIXER LA MA TAT DINH CHU KHONG PHAI `claude-code-action`:
# `claude-code-action` tu SKIP khi tep workflow khac ban tren nhanh mac dinh, NHUNG van exit
# thanh cong — tren mot nhanh PR nhu day, do la mot cai "xanh gia" se lam hong dung cai bang chung
# ta can. Thu dang do o day la co che App push + CI tu kich hoat, nen fixer phai tat dinh de khong
# lan bien so. Doi fixer sang Claude la buoc rieng, lam sau khi workflow da nam tren `main`.
#
# LUOI CHONG LAP — theo DIEU KIEN, khong theo bo dem:
# autofix chi push khi `status != expected`. Sua xong thi dieu kien sai, lan chay ke tiep khong
# push nua. Chuoi tu ket thuc. Tran commit lien tiep la luoi du phong thu hai.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .github/workflows/autopilot-autofix.yml
      - docs/poc/autopilot/**

permissions:
  contents: read

concurrency:
  group: autopilot-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  autofix:
    name: autopilot-autofix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SELFCHECK: docs/poc/autopilot/selfcheck.json
      SANDBOX_DIR: docs/poc/autopilot
      FIX_MARKER: 'Autopilot-Fix: sandbox-selfcheck'
      MAX_CONSECUTIVE_FIX_COMMITS: '3'
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Mint Nexagent Autopilot installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NEXAGENT_AUTOPILOT_CLIENT_ID }}
          private-key: ${{ secrets.NEXAGENT_AUTOPILOT_PRIVATE_KEY }}

      - name: Checkout PR head branch with App token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Decide whether there is anything to fix
        id: triage
        shell: bash
        run: |
          set -euo pipefail

          head_a="$(git rev-parse HEAD)"
          echo "head_a=$head_a" >> "$GITHUB_OUTPUT"
          echo "HEAD_A=$head_a"

          if [ ! -f "$SELFCHECK" ]; then
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            echo "AUTOFIX_TRIAGE=NO_SELFCHECK_FILE"
            exit 0
          fi

          status="$(jq -r '.status' "$SELFCHECK")"
          expected="$(jq -r '.expected_status' "$SELFCHECK")"
          echo "AUTOFIX_OBSERVED_STATUS=$status"
          echo "AUTOFIX_EXPECTED_STATUS=$expected"

          # Luoi chong lap 1 — DIEU KIEN: khong con gi hong thi khong push.
          if [ "$status" = "$expected" ]; then
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            echo "AUTOFIX_TRIAGE=NOTHING_TO_FIX"
            echo "LOOP_GUARD_VERDICT=BLOCKED_NOTHING_TO_FIX"
            exit 0
          fi

          # Luoi chong lap 2 — TRAN commit sua lien tiep, phong khi luoi 1 bi noi long.
          consecutive=0
          for sha in $(git rev-list -n "$MAX_CONSECUTIVE_FIX_COMMITS" HEAD); do
            if git log -1 --format='%B' "$sha" | grep -qF "$FIX_MARKER"; then
              consecutive=$((consecutive + 1))
            else
              break
            fi
          done

          if [ "$consecutive" -ge "$MAX_CONSECUTIVE_FIX_COMMITS" ]; then
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            echo "LOOP_GUARD_VERDICT=BLOCKED_RUNAWAY"
            echo "Guard: $consecutive commit sua lien tiep — cham tran, dung lai."
            exit 0
          fi

          echo "should_fix=true" >> "$GITHUB_OUTPUT"
          echo "AUTOFIX_TRIAGE=WILL_FIX"
          echo "LOOP_GUARD_VERDICT=ALLOWED"

      - name: Resolve App bot commit identity
        id: bot
        if: steps.triage.outputs.should_fix == 'true'
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          bot_login="${APP_SLUG}[bot]"
          bot_id="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${APP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/users/${APP_SLUG}%5Bbot%5D" | jq -r '.id'
          )"

          if [ -z "$bot_id" ] || [ "$bot_id" = "null" ]; then
            echo "FAIL: khong doc duoc user id cua $bot_login"
            exit 1
          fi

          echo "login=$bot_login" >> "$GITHUB_OUTPUT"
          echo "email=${bot_id}+${bot_login}@users.noreply.github.com" >> "$GITHUB_OUTPUT"
          echo "BOT_LOGIN=$bot_login"

      - name: Apply the fix
        if: steps.triage.outputs.should_fix == 'true'
        shell: bash
        env:
          FIXED_BY: ${{ steps.bot.outputs.login }}
          FIX_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          tmp="$(mktemp)"
          jq --arg by "$FIXED_BY" \
             --argjson run "$FIX_RUN_ID" \
             '.status = .expected_status | .fixed_by = $by | .fix_run_id = $run' \
             "$SELFCHECK" > "$tmp"
          mv "$tmp" "$SELFCHECK"

          echo "AUTOFIX_NEW_STATUS=$(jq -r '.status' "$SELFCHECK")"
          cat "$SELFCHECK"

      - name: Commit fix as App bot
        id: commit
        if: steps.triage.outputs.should_fix == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  '${{ steps.bot.outputs.login }}'
          git config user.email '${{ steps.bot.outputs.email }}'

          git add "$SELFCHECK"

          git commit \
            -m "fix(poc): autopilot sua sandbox selfcheck cho CI xanh lai" \
            -m "$FIX_MARKER" \
            -m "App-Run-Id: ${{ github.run_id }}"

          head_b="$(git rev-parse HEAD)"
          echo "head_b=$head_b" >> "$GITHUB_OUTPUT"
          echo "HEAD_B=$head_b"

      - name: Assert fix touches ONLY the sandbox
        if: steps.triage.outputs.should_fix == 'true'
        shell: bash
        env:
          HEAD_A: ${{ steps.triage.outputs.head_a }}
          HEAD_B: ${{ steps.commit.outputs.head_b }}
        run: |
          set -euo pipefail

          if [ "$HEAD_A" = "$HEAD_B" ]; then
            echo "FAIL: HEAD khong doi — khong co commit sua nao duoc tao."
            exit 1
          fi

          changed="$(git diff --name-only "$HEAD_A" "$HEAD_B")"
          out_of_scope="$(printf '%s\n' "$changed" | grep -v "^${SANDBOX_DIR}/" || true)"
          if [ -n "$out_of_scope" ]; then
            echo "FAIL: ban sua cham vao ngoai sandbox:"
            printf '%s\n' "$out_of_scope"
            exit 1
          fi

          echo "SANDBOX_SCOPE_VERDICT=PASS"
          printf '%s\n' "$changed"

      - name: Push fix to PR branch with App token
        if: steps.triage.outputs.should_fix == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          echo "AUTOFIX_PUSH_VERDICT=PASS"

      - name: Evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Nexagent Autopilot — autofix"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| PR | #${{ github.event.pull_request.number }} |"
            echo "| HEAD_A | \`${{ steps.triage.outputs.head_a }}\` |"
            echo "| HEAD_B | \`${{ steps.commit.outputs.head_b || 'not pushed' }}\` |"
            echo "| App run id | ${{ github.run_id }} |"
            echo "| Loop guard | should_fix=${{ steps.triage.outputs.should_fix }} |"
          } >> "$GITHUB_STEP_SUMMARY"
