# Orchestrator V0 — READ-ONLY.
#
# Chay Giao thuc Autopilot V0 (`tools/autopilot-protocol/`) tren su kien GitHub THAT, va chi lam
# hai viec: dang mot comment ket qua, va doi nhan trang thai. Khong merge, khong ghi ma nguon,
# khong dispatch agent nao. Xem hop dong task o Issue #165 va §17 cua
# docs/phat-trien/van-hanh/autopilot-protocol-v0.md.
#
# BON DIEU CAN BIET TRUOC KHI SUA TEP NAY
#
# 1. HAI TRONG BA TRIGGER CHAY BAN TREN NHANH MAC DINH, khong phai ban trong PR. Tai lieu GitHub
#    liet ke `issue_comment` va `check_suite` trong nhom "chi kich hoat neu tep workflow co tren
#    nhanh mac dinh". Nen mot thay doi o hai duong do chi co hieu luc SAU KHI merge — va vi the
#    khong the chung minh chung tu chinh PR them chung. Dung doc CI xanh cua PR thanh
#    "orchestrator da chay that".
#
#    `pull_request` la NGOAI LE, va no la ngoai le QUAN TRONG: no KHONG nam trong nhom do, no chay
#    ban cua chinh PR (`GITHUB_REF` = `refs/pull/N/merge`). Do la ly do job `preflight` ben duoi
#    nam o dung trigger do — day la cho DUY NHAT trong repo nay do duoc mot thay doi quyen TRUOC
#    khi thay doi ay len `main`.
#
# 2. VA CHINH VI THE, `pull_request` KHONG DUOC CAM QUYEN GHI (blocker B4 cua PR #167). Tren trigger
#    do, ma nguon cua PR chua duyet quyet dinh CA BA thu: `main.mjs`, cac tep giao thuc no import,
#    VA CHINH TEP YAML NAY. Mot job `pull_request` cam `issues: write` la mot job cho phep ma nguon
#    chua duyet ghi vao dung mat phang trang thai ma no dang xin duyet. Nen workflow nay tach lam
#    HAI duong thuc thi, va ranh gioi giua chung la quyen chu khong phai loi hua:
#
#      duong KHONG TIN CAY  `preflight` + `orchestrate-readonly`
#                           chay ma nguon PR · quyen TOAN DOC · khong mot loi goi ghi nao
#      duong TIN CAY        `orchestrate`
#                           chi `issue_comment`/`check_suite` (GitHub bat buoc ban nhanh mac dinh)
#                           · checkout GHIM vao nhanh mac dinh · day la noi DUY NHAT co quyen ghi
#
#    KHONG duoc "sua" dieu nay bang `pull_request_target` roi checkout ma nguon PR: lam vay la lay
#    lai dung bo quyen ay va trao cho dung doan ma nguon ay, chi khac ten trigger.
#
#    Cai gia phai tra, noi thang: duong `pull_request` khong con dang duoc comment ket qua. Mot bo
#    dieu kien tro nen day du o do se cho den `issue_comment`/`check_suite` ke tiep moi duoc phat.
#    Do la he qua cua chinh B4 — khong the vua cho ma nguon PR chay vua cho no ghi.
#
# 3. Mac dinh la DRY-RUN. No quyet dinh va ghi ra log day du, nhung KHONG dang comment va KHONG
#    doi nhan. De bat that: dat bien repo `AUTOPILOT_DRY_RUN` = `false`. Mac dinh nay la co y —
#    mot workflow tu dang comment vao moi PR ma bat ngay luc merge la thu khong ai kip xem lai.
#
# 4. Khoi `permissions:` la mot DANH SACH DONG. Khai no tuong minh thi moi quyen KHONG duoc ke ra
#    deu bang `none`. Them mot loi goi API moi vao `main.mjs` ma quen them quyen tuong ung o day
#    thi job se do o SAN XUAT, khong do trong PR (xem dieu 1). Do la ly do `preflight` ton tai, va
#    la ly do `tests/workflow-contract.test.mjs` doc thang tep nay.
name: autopilot-orchestrator

# BA TRIGGER CUA HOP DONG #165. Chung khong phai ba nhanh xu ly — chung la BA CACH mot bo dieu
# kien tro nen day du, va ca ba di chung dung mot loi quyet dinh (`decideOnComment`):
#
#   issue_comment  — thong diep BUILD_READY den sau cung
#   check_suite    — CI xong sau cung
#   pull_request   — HEAD dung yen sau cung (mo lai PR, hoac push landing dung SHA da co CI)
#
# Vi ba duong nay co the cung du dieu kien tren MOT HEAD, orchestrator so khoa idempotency cua
# giao thuc voi luong comment truoc khi dang — khong thi mot HEAD lanh ba comment giong het nhau.
#
# GIOI HAN DA BIET CUA `check_suite`, noi thang de khong ai doc nham:
# tai lieu GitHub ghi "to prevent recursive workflows, this event does not trigger workflows if the
# check suite was created by GitHub Actions". Moi check trong repo nay deu do GitHub Actions tao,
# nen tren THUC TE duong `check_suite` se KHONG kich hoat boi chinh workflow `ci`. No duoc cai dat
# day du va fail-closed theo hop dong, nhung no chua co bang chung chay that — xem muc NOT PROVEN
# cua tools/autopilot-orchestrator/README.md.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize]
  check_suite:
    types: [completed]

# SAN MAC DINH CUA CA WORKFLOW LA TOAN DOC.
#
# Khong mot quyen ghi nao o day, va do la ranh gioi B4: mot job quen khai `permissions:` cua rieng
# no se thua bo nay — tuc thua mot bo KHONG GHI DUOC. Quyen ghi chi duoc cap TUONG MINH, tai dung
# mot job, va job do khong chay ma nguon cua PR.
#
#   contents: read       -> GET /rules/branches/main         (danh sach check bat buoc)
#   pull-requests: read  -> GET /pulls/{n}                   (HEAD that)
#   issues: read         -> GET /issues/{n}/comments         (tra cuu thong diep + so ledger)
#   checks: read         -> GET /commits/{sha}/check-runs    (bang chung CI buoc vao HEAD)
#   actions: read        -> GET /actions/runs?head_sha=...   (so hieu lan chay CI)
#
# Hai dong cuoi la blocker B1 cua PR #167: chung tung thieu, nen lan chay THAT sau khi merge se
# hong TRUOC khi sinh ra duoc bang chung CI. Job `preflight` do lai ca nam duong nay.
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read

# Khoa theo PR. Ba trigger mang so PR o ba cho khac nhau, nen phai gop lai — neu khong thi ba su
# kien cua cung mot PR se chay song song va cung quyet dinh tren mot HEAD.
concurrency:
  group: >-
    autopilot-orchestrator-${{ github.event.issue.number
    || github.event.pull_request.number
    || (github.event.check_suite.pull_requests[0] && github.event.check_suite.pull_requests[0].number)
    || github.run_id }}
  cancel-in-progress: false

jobs:
  # ===============================================================================================
  # DUONG KHONG TIN CAY — chay ma nguon cua PR. Hai job duoi day deu TOAN DOC.
  # ===============================================================================================

  # DO QUYEN CUA TOKEN BANG CACH GOI THAT.
  #
  # Chi chay o `pull_request`, va do la CO Y: day la trigger duy nhat chay ban workflow cua chinh
  # PR. Nho vay mot thay doi o khoi `permissions:` duoc do TRUOC khi len `main`, thay vi lo ra o
  # lan chay that dau tien sau merge.
  #
  # No do NAM loi goi DOC cua `main.mjs`: goi duoc, va tra ve dung hinh dang. No KHONG con do hai
  # quyen ghi — va khong the do duoc nua, vi chinh B4 cam job nay cam chung. Phan quyen ghi duoc
  # canh bang hop dong TINH trong `tests/workflow-contract.test.mjs` (khoi `permissions:` cua job
  # `orchestrate`), khong bang mot loi goi that. Su danh doi do la co that va duoc ghi o muc
  # NOT PROVEN cua README — khong the vua chay ma nguon PR vua cam quyen ghi de do chung.
  preflight:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Quyen cua GITHUB_TOKEN du cho moi loi goi DOC cua orchestrator
        run: node tools/autopilot-orchestrator/src/preflight.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPILOT_PREFLIGHT_PR: ${{ github.event.pull_request.number }}
          AUTOPILOT_PREFLIGHT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # LOI QUYET DINH DAY DU, KHONG MOT LOI GOI GHI NAO.
  #
  # Cung mot `main.mjs`, cung mot loi quyet dinh, cung mot bang chung — khac dung mot thu: job nay
  # khong co quyen ghi, va `AUTOPILOT_MUTATIONS` bao ma nguon dung lai truoc loi goi ghi thay vi
  # dam vao buc tuong quyen roi lam do CI tren moi PR.
  #
  # Gia tri cua no la QUAN SAT: mot thay doi lam loi quyet dinh hong se lo ra ngay trong PR, o dang
  # mot dong log `orchestrator: "no-write"` khac di — thay vi lo ra o lan chay ghi that dau tien.
  orchestrate-readonly:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Chay orchestrator (khong ghi)
        run: node tools/autopilot-orchestrator/src/main.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPILOT_MUTATIONS: forbidden
          AUTOPILOT_REPO_OWNER_LOGIN: ${{ github.repository_owner }}
          AUTOPILOT_REVIEWER_APP_SLUG: ${{ vars.AUTOPILOT_REVIEWER_APP_SLUG }}
          AUTOPILOT_DRY_RUN: ${{ vars.AUTOPILOT_DRY_RUN || 'true' }}

  # ===============================================================================================
  # DUONG TIN CAY — noi DUY NHAT co quyen ghi.
  # ===============================================================================================

  # `issue_comment` va `check_suite` nam trong nhom su kien GitHub CHI chay ban workflow tren nhanh
  # mac dinh. Nen tren hai trigger nay, tep YAML dang chay la ban DA DUOC MERGE — mot PR mo khong
  # sua duoc no. Do la dieu kien du de job nay cam quyen ghi.
  #
  # `pull_request` KHONG co trong dieu kien duoi day, va do la chinh blocker B4.
  #
  # CHECKOUT GHIM VAO NHANH MAC DINH, khong dua vao `github.sha`. Ly do la fail-closed: neu
  # `github.sha` cua `check_suite` co luc tro ve `head_sha` cua chinh check-suite do (mot HEAD co
  # the thuoc mot PR), thi checkout mac dinh se keo MA NGUON PR vao mot job dang cam quyen ghi. Ghim
  # ten nhanh mac dinh lam cau hoi do bien mat: khong co duong nao cho ra ma nguon PR.
  orchestrate:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
      || (github.event_name == 'check_suite'
          && github.event.check_suite.pull_requests[0] != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # DUNG MOT QUYEN GHI, VA NO LA `issues: write` (blocker B7 cua PR #167).
    #
    # Ca ba loi goi ghi cua orchestrator deu la `/issues/...`: dang comment, gan nhan, go nhan. Tai
    # lieu REST cua GitHub ghi cho ca ba cung mot cau — can "Issues" write HOAC "Pull requests"
    # write, MOT trong hai. Nen `pull-requests` o day chi can `: read`, cho dung mot viec con lai:
    # `GET /pulls/{n}` lay HEAD that.
    #
    # Ban truoc cam ca `pull-requests: write`. Khong mot loi goi nao doi no, va no uy quyen cho MOI
    # thao tac ghi khac tren PR — doi base, doi title, dong PR — trong dung mot job cam quyen ghi
    # cua ca mat phang dieu khien. Bang `WRITE_CALLS` trong `src/permissions.mjs` khoa dieu do lai:
    # quyen ghi o day DAN XUAT tu loi goi co that, va `tests/workflow-contract.test.mjs` so khop
    # CHINH XAC — them mot dong `: write` khong co endpoint doi no thi bai kiem do.
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Chay orchestrator
        run: node tools/autopilot-orchestrator/src/main.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPILOT_MUTATIONS: allowed
          # So do principal la CAU HINH, khong ghi cung trong ma nguon (§2.1). Doi app cua nguoi
          # duyet = doi bien o day, khong phai sua ma roi merge lai.
          #
          # KHONG CO `|| '<slug nao do>'` o dong AUTOPILOT_REVIEWER_APP_SLUG, va do la mot quyet
          # dinh (blocker B3 cua PR #167). Mot mac dinh se LANG LE trao vai `CHATGPT_REVIEWER` —
          # vai quyet dinh `REVIEW_PASS` CUA AI duoc tinh — cho mot app ghi cung trong ma nguon,
          # ngay khi bien repo bi xoa hoac chua tung duoc dat. Thieu bien thi job DO, va do la
          # huong dong.
          AUTOPILOT_REPO_OWNER_LOGIN: ${{ github.repository_owner }}
          AUTOPILOT_REVIEWER_APP_SLUG: ${{ vars.AUTOPILOT_REVIEWER_APP_SLUG }}
          AUTOPILOT_DRY_RUN: ${{ vars.AUTOPILOT_DRY_RUN || 'true' }}
