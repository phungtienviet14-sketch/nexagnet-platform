name: deploy

# CD TU DONG cho khach chinh (`ultty`) khi co push vao main.
#
# File nay CHI la mot cong goi: toan bo viec deploy nam trong `reusable-deploy-tenant.yml`, dung
# hiet mot ban voi duong deploy tay `deploy-tenant.yml`. Truoc 17/08/2026 no cheo mot ban logic
# rieng (checkout + auth + goi deploy-ci.sh) — hai ban song song la cach chac chan de mot ban duoc
# sua con ban kia thi khong.
#
# Job dung environment `production`: dat required reviewers cho environment do thi moi lan deploy
# se cho nguoi duyet — dung voi rang buoc D4/D16 (chua duoc tu gui/PII that khi chua co van ban).
#
# Truoc lan chay dau tien, chay `deploy/netviet/setup-github-oidc.sh` roi dat 2 repository
# variable: GCP_WORKLOAD_IDENTITY_PROVIDER va GCP_DEPLOY_SERVICE_ACCOUNT.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # KHONG deploy ca stack VM khi lan push chi dong toi nhung thu khong chay tren VM do. Truoc day
    # mot lan sua trang marketing hay mot dong tai lieu cung xep hang mot lan roll-out API va treo
    # o cong duyet `production` — nhieu den muc khong con ai doc hang doi do nua.
    paths-ignore:
      - 'apps/marketing/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/deploy-marketing.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  # Cung nhom voi `deploy-tenant.yml` cho khach `ultty`: mot lan deploy tay va mot lan deploy theo
  # push khong duoc phep cung sua mot thu muc stack.
  group: deploy-tenant-ultty
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-tenant.yml
    with:
      tenant: ultty
      environment: production
    secrets: inherit
